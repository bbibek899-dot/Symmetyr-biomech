<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#14202d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00e676" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="rgba(0,229,255,0.25)" stroke-width="4"/>
  
  <!-- Central Vertical Plumb Line -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="rgba(0, 229, 255, 0.45)" stroke-width="3" stroke-dasharray="8 8"/>
  
  <!-- Horizontal Shoulder and Pelvis Reference Lines -->
  <line x1="120" y1="168" x2="392" y2="168" stroke="rgba(0, 230, 118, 0.35)" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="160" y1="272" x2="352" y2="272" stroke="rgba(0, 230, 118, 0.35)" stroke-width="2.5" stroke-dasharray="6 6"/>
  
  <!-- Head Node -->
  <circle cx="256" cy="100" r="32" fill="#101923" stroke="#00e5ff" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="256" cy="100" r="10" fill="#ffffff"/>
  
  <!-- Spine Link -->
  <line x1="256" y1="132" x2="256" y2="272" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Shoulders -->
  <line x1="160" y1="168" x2="352" y2="168" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Arms -->
  <line x1="160" y1="168" x2="130" y2="240" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="240" x2="115" y2="310" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="352" y1="168" x2="382" y2="240" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="382" y1="240" x2="397" y2="310" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pelvis -->
  <line x1="192" y1="272" x2="320" y2="272" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Legs -->
  <line x1="192" y1="272" x2="185" y2="368" stroke="#00e676" stroke-width="7" stroke-linecap="round"/>
  <line x1="185" y1="368" x2="180" y2="445" stroke="#00e676" stroke-width="7" stroke-linecap="round"/>
  
  <line x1="320" y1="272" x2="327" y2="368" stroke="#00e676" stroke-width="7" stroke-linecap="round"/>
  <line x1="327" y1="368" x2="332" y2="445" stroke="#00e676" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Feet -->
  <line x1="180" y1="445" x2="155" y2="455" stroke="#00e676" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="445" x2="357" y2="455" stroke="#00e676" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Joint Circles -->
  <circle cx="160" cy="168" r="11" fill="#fff" stroke="#00e5ff" stroke-width="4"/>
  <circle cx="352" cy="168" r="11" fill="#fff" stroke="#00e5ff" stroke-width="4"/>
  
  <circle cx="192" cy="272" r="11" fill="#fff" stroke="#00e676" stroke-width="4"/>
  <circle cx="320" cy="272" r="11" fill="#fff" stroke="#00e676" stroke-width="4"/>
  
  <circle cx="185" cy="368" r="10" fill="#fff" stroke="#00e676" stroke-width="4"/>
  <circle cx="327" cy="368" r="10" fill="#fff" stroke="#00e676" stroke-width="4"/>
  
  <circle cx="180" cy="445" r="9" fill="#fff" stroke="#00e676" stroke-width="3"/>
  <circle cx="332" cy="445" r="9" fill="#fff" stroke="#00e676" stroke-width="3"/>
</svg>
